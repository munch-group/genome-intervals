project:
  type: website
  output-dir: _build
  # resources:
    # - examples/single-page
    # - examples/pkgdown
    # - examples/auto-package
    # - objects.txt
    # - objects-test.txt

execute:
  freeze: auto
  echo: true

metadata-files:
  - api/_sidebar.yml

filters:
  - "interlinks"

interlinks:
  fast: true
  sources:
    python:
      url: https://docs.python.org/3/
    griffe:
      url: https://mkdocstrings.github.io/griffe/
    numpy:
      url: https://numpy.org/doc/stable/
    pandas:
      url: https://pandas.pydata.org/docs/
    matplotlib:
      url: https://matplotlib.org/stable/
    scipy:
      url: https://docs.scipy.org/doc/scipy/
    statsmodels:
      url: https://www.statsmodels.org/stable/
    # quartodoc-test:
    #   url: https://machow.github.io/quartodoc
    #   inv: objects-test.txt

website:
  title: "genome-intervals"
  page-navigation: true
  navbar:
    left:
      - href: api/
        text: API reference
    right:
      - icon: github
        href: https://github.com/munch-group/genome-intervals/
  sidebar:
    - id: pages
      title: Get Started
      style: floating
      align: left
      contents:
        - pages/getting_started.qmd
        - section: "Manipulation"
          contents:
            - pages/set_operations.ipynb
            - pages/remapping.ipynb
        - section: "Tests"
          contents:
            - pages/interval_tests.ipynb
        - section: "Utilities"
          contents:
            - pages/decorators.ipynb

lightbox: true

format:
  html:
    theme: cosmo
    css:
      - api/_styles-quartodoc.css
      - styles.css
    toc: true
    # highlight-style: breeze 
    # highlight-style: github 
    # code-block-bg: true
    mermaid:
      theme: neutral 

quartodoc:
  package: genome_intervals
  style: pkgdown
  dir: api
  render_interlinks: true
  options:
    signature_name: full
  renderer:
    style: markdown
    table_style: description-list
  sidebar: "api/_sidebar.yml"
  css: "api/_styles-quartodoc.css"

  sections:
    - title: Genomic set operations
      package: genome_intervals
      desc: |
        Set operations on pandas.DataFrames with columns for chromosome, start, and end.
      contents:
        - interval_diff     
        - interval_union   
        - interval_intersect 
        - interval_collapse
    - title: Remapping
      package: genome_intervals.remapping
      desc: |
        Mapping intervals relative to other coordinates.
      contents:        
        - interval_distance
        - remap_interval_data
    - title: Statistics
      package: genome_intervals.stats
      desc: Mapping intervals relative to other coordinates.
      contents:
        - proximity_stat        
        - jaccard_stat
    - title: Decorators
      package: genome_intervals.decorators
      desc: |
        Utilities for user created genomic intervals and bootstrap tests.
      contents:
        - genomic 
        - bootstrap
    - title: Interval set utilities
      package: genome_intervals.interval_set_op
      desc: |
        Set operations on sorted lists of (start, end) tuples.
      contents:
        - union 
        - diff
        - invert
        - intersect
        - collapse
    - title: Interval mapping utilities
      package: genome_intervals.remapping
      desc: |
        Set operations on sorted lists of (start, end) tuples.
      contents:
        - remap 
